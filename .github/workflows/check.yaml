name: Check

on:
  push:
    branches: [master, upgrade-test-newrules-reorg]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Yarn Switch
        run: |
          curl -fsSL https://repo.yarnpkg.com/install | bash
          echo "$HOME/.yarn/switch/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run lint
        run: yarn lint
